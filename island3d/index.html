<script>
let audioCtx = null;
function ensureAudio() {

}
function tone(f, d = 0.2, type = 'triangle', v = 0.28, delay = 0) {

    ensureAudio();

    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
    o.connect(g); g.connect(audioCtx.destination); o.start(t0); o.stop(t0 + d);
  } catch (e) {}
}
const sfx = {
  move: () => tone(560, 0.07, 'sine', 0.12),
  pick: () => tone(700, 0.1, 'sine', 0.2),
  rotate: () => { tone(520, 0.08, 'sine', 0.18); tone(780, 0.1, 'sine', 0.18, 0.06); },
  place: () => { tone(660, 0.12); tone(990, 0.18, 'triangle', 0.28, 0.08); },
  wrong: () => tone(220, 0.22, 'sine', 0.2),
  win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.3, 'triangle', 0.32, [0, .11, .22, .33, .48, .63][i])),
};

/* ---------- 語音：瀏覽器內建（挑最自然的） + Azure 雲端（若在奇奇島設定過金鑰） ---------- */
let voiceCfg = { engine: 'browser', key: '', region: 'eastasia', voice: 'zh-TW-HsiaoChenNeural', rate: '-15%' };
try { Object.assign(voiceCfg, JSON.parse(localStorage.getItem('qiqi-voice-cfg') || '{}')); } catch (e) {}
let zhVoice = null, lastSay = '', speakSeq = 0, cloudSrc = null, cloudWarned = false, sdkPromise = null;
const ttsCache = new Map();

function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^(zh|cmn)/i.test(v.lang) && !/HK|yue/i.test(v.lang + v.name));
  const score = v => (/TW|Taiwan|臺灣|台灣/i.test(v.lang + v.name) ? 60 : 0) + (/Natural|Neural/i.test(v.name) ? 100 : 0) + (/Google/i.test(v.name) ? 45 : 0);
  vs.sort((a, b) => score(b) - score(a));
  let saved = null; try { saved = localStorage.getItem('qiqi-voice-name'); } catch (e) {}
  zhVoice = vs.find(v => v.name === saved) || vs[0] || null;
}
if ('speechSynthesis' in window) { speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); }

function cleanText(t) {
  return String(t).replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}]/gu, '').replace(/\s+/g, ' ').trim();
}
function useCloud() { return voiceCfg.engine === 'azure' && voiceCfg.key && voiceCfg.region; }
function stopSpeech() {
  speakSeq++;
  if (cloudSrc) { try { cloudSrc.stop(); } catch (e) {} cloudSrc = null; }
  if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) {} }
}
function ssml(text) {
  const esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return `<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="zh-TW"><voice name="${voiceCfg.voice}"><prosody rate="${voiceCfg.rate}" pitch="+3%">${esc}</prosody></voice></speak>`;
}
async function azureBytes(body) {
  let res;
  try {
    res = await fetch(`https://${voiceCfg.region}.tts.speech.microsoft.com/cognitiveservices/v1`, {
      method: 'POST', body,
      headers: { 'Ocp-Apim-Subscription-Key': voiceCfg.key, 'Content-Type': 'application/ssml+xml', 'X-Microsoft-OutputFormat': 'audio-24khz-48kbitrate-mono-mp3' }
    });
  } catch (e) {
    if (!sdkPromise) sdkPromise = new Promise((ok, no) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js';
      s.onload = () => window.SpeechSDK ? ok(window.SpeechSDK) : no(new Error('SDK 載入失敗'));
      s.onerror = () => { sdkPromise = null; no(new Error('無法連線雲端語音')); };
      document.head.appendChild(s);
    });
    const SDK = await sdkPromise;
    return new Promise((ok, no) => {
      const cfg = SDK.SpeechConfig.fromSubscription(voiceCfg.key, voiceCfg.region);
      cfg.speechSynthesisOutputFormat = SDK.SpeechSynthesisOutputFormat.Audio24Khz48KBitRateMonoMp3;
      const syn = new SDK.SpeechSynthesizer(cfg, null);
      syn.speakSsmlAsync(body, r => { syn.close(); r.reason === SDK.ResultReason.SynthesizingAudioCompleted ? ok(r.audioData) : no(new Error(r.errorDetails)); },
        err => { syn.close(); no(new Error(String(err))); });
    });
  }
  if (!res.ok) throw new Error(res.status === 401 ? '金鑰或區域不正確' : `雲端語音錯誤 ${res.status}`);
  return res.arrayBuffer();
}
async function speakCloud(text, seq) {
  const body = ssml(text);
  let buf = ttsCache.get(body);
  if (!buf) {
    const bytes = await azureBytes(body);
    ensureAudio();
    buf = await new Promise((ok, no) => audioCtx.decodeAudioData(bytes.slice(0), ok, no));
    ttsCache.set(body, buf);
  }
  if (seq !== speakSeq) return;
  const src = audioCtx.createBufferSource();
  src.buffer = buf; src.connect(audioCtx.destination); src.start(); cloudSrc = src;
}
function speakBrowser(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    if (!zhVoice) pickVoice();
    const u = new SpeechSynthesisUtterance(text);
    if (zhVoice) { u.voice = zhVoice; u.lang = zhVoice.lang; } else u.lang = 'zh-TW';
    const natural = zhVoice && /Natural|Neural|Google/i.test(zhVoice.name);
    u.rate = natural ? 0.95 : 0.9; u.pitch = natural ? 1.05 : 1.18;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function say(text) {
  lastSay = text;
  document.getElementById('subtitle-text').textContent = text;
  const t = cleanText(text);
  if (!t) return;
  stopSpeech();
  const seq = speakSeq;
  if (useCloud()) {
    speakCloud(t, seq).catch(err => {
      if (!cloudWarned) { cloudWarned = true; toast(`☁️ 雲端語音暫時不能用（${err.message}），先用內建語音`); }
      if (seq === speakSeq) speakBrowser(t);
    });
  } else speakBrowser(t);
}
function repeatVoice() { ensureAudio(); if (lastSay) say(lastSay); }
function toast(t, ms = 3000) {
  const el = document.getElementById('toast');
  el.textContent = t; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), ms);
}
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };


sfx.splash = () => { tone(300, 0.25, 'sine', 0.3); tone(180, 0.35, 'sine', 0.25, 0.08); tone(900, 0.12, 'triangle', 0.12, 0.05); };
sfx.star = () => { tone(880, 0.12); tone(1175, 0.14, 'triangle', 0.28, 0.08); tone(1568, 0.22, 'triangle', 0.28, 0.16); };
sfx.gate = () => { tone(392, 0.15, 'square', 0.12); tone(523, 0.15, 'square', 0.12, 0.12); tone(659, 0.25, 'square', 0.12, 0.24); };
sfx.step = () => tone(520, 0.07, 'sine', 0.16);
sfx.push = () => tone(240, 0.12, 'triangle', 0.25);
sfx.bump = () => tone(150, 0.09, 'sine', 0.16);

const cvs = document.getElementById('confetti'), cctx = cvs.getContext('2d');
let parts = [];
function resizeCvs() { cvs.width = innerWidth; cvs.height = innerHeight; }
addEventListener('resize', resizeCvs); resizeCvs();
function confetti(n = 140) {
  const C = ['#f43f5e', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899', '#facc15'];
  for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2, y: innerHeight / 2, vx: (Math.random() - 0.5) * 22, vy: (Math.random() - 0.85) * 22 - 3,
    s: Math.random() * 10 + 6, c: C[i % C.length], r: Math.random() * 360, vr: (Math.random() - 0.5) * 14, life: 100 });
}
(function loop() {
  cctx.clearRect(0, 0, cvs.width, cvs.height);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.36; p.r += p.vr; p.life -= 1.3;
    cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.r * Math.PI / 180); cctx.fillStyle = p.c; cctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s); cctx.restore(); });
  parts = parts.filter(p => p.life > 0);
  requestAnimationFrame(loop);
})();
const FLUENT_MAP = {"↩️":"21a9-fe0f","▶":"25b6-fe0f","◀":"25c0-fe0f","☁️":"2601-fe0f","⛵":"26f5","⭐":"2b50","🌈":"1f308","🌋":"1f30b","🌙":"1f319","🌞":"1f31e","🌱":"1f331","🌲":"1f332","🌳":"1f333","🌴":"1f334","🌸":"1f338","🌼":"1f33c","🍄":"1f344","🍦":"1f366","🎁":"1f381","🎉":"1f389","🎋":"1f38b","🎮":"1f3ae","🏆":"1f3c6","🏗️":"1f3d7-fe0f","🏘️":"1f3d8-fe0f","🏝️":"1f3dd-fe0f","🏠":"1f3e0","🏰":"1f3f0","🐙":"1f419","🐚":"1f41a","🐟":"1f41f","🐠":"1f420","🐰":"1f430","🐳":"1f433","🐼":"1f43c","👆":"1f446","👇":"1f447","👣":"1f463","👩‍🏫":"1f469-200d-1f3eb","💡":"1f4a1","📋":"1f4cb","🔄":"1f504","🔊":"1f50a","🔍":"1f50d","🔥":"1f525","🔸":"1f538","🔺":"1f53a","🗺️":"1f5fa-fe0f","😢":"1f622","🚀":"1f680","🚂":"1f682","🤖":"1f916","🥕":"1f955","🥚":"1f95a","🦁":"1f981","🦋":"1f98b","🦖":"1f996","🧩":"1f9e9","🪐":"1fa90"};
const FLUENT_CDNS = ['https://cdn.jsdelivr.net/npm/@lobehub/fluent-emoji-3d@1.1.0/assets/', 'https://unpkg.com/@lobehub/fluent-emoji-3d@1.1.0/assets/'];
const EMOJI_RE = /\p{Extended_Pictographic}(?:️|⃣)?(?:‍\p{Extended_Pictographic}️?)*/gu;
let fluentOffline = false;
const SKIP = 'script,style,svg,canvas,[data-no-fluent]';
function feImg(e) {

  img.className = 'fe'; img.alt = e; img.draggable = false;

  return img;
}
function feText(node) {

  const [dx, dy] = DIR4[path[0]];
  const c = cellPos(S.p);
  hintArrow.position.set(c.x + dx, 1.25, c.z + dy); hintArrow.visible = true;
  const willPush = S.crates.includes(S.p + dx + dy * L.w);
  say(willPush ? '看箭頭！往這邊推箱子！' : '看箭頭！往這邊走一步！');
}
function rotate(d) { ensureAudio(); az += d * 90; sfx.rotate(); }

/* 方向鍵依照目前視角換算：按「上」永遠是往畫面裡面走 */
function dir(name) {
  ensureAudio();
  if (overlayOn('levels') || overlayOn('win')) { focusMove(name); return; }
  let v = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[name];
  const q = ((Math.round(az / 90) % 4) + 4) % 4;
  for (let i = 0; i < q; i++) v = [v[1], -v[0]];
  move(v[0], v[1]);
}

/* ---------- 選關與過關畫面的焦點 ---------- */
let focusList = [], focusIdx = 0, focusCols = 1;
function setFocusList() {
  if (overlayOn('win')) { focusList = [...document.querySelectorAll('.wb')].filter(b => b.style.display !== 'none'); focusCols = focusList.length; }
  else { focusList = [...document.querySelectorAll('.lv')]; focusCols = innerWidth <= 760 ? 2 : 5; }
}
function paintFocus() { document.querySelectorAll('.focus').forEach(e => e.classList.remove('focus')); if (focusList[focusIdx]) { focusList[focusIdx].classList.add('focus'); focusList[focusIdx].scrollIntoView?.({ block: 'nearest' }); } }
function focusMove(name) {
  const d = { left: -1, right: 1, up: -focusCols, down: focusCols }[name];
  const n = focusIdx + d;
  if (n >= 0 && n < focusList.length) { focusIdx = n; sfx.move(); paintFocus(); }
}
function openLevels() {
  ensureAudio();
  $('win').classList.remove('on');
  const grid = $('level-grid'); grid.innerHTML = '';
  LEVELS.forEach((d, i) => {
    const st = save.stars[i] || 0;
    const b = document.createElement('button');
    b.className = 'lv' + (st ? ' done' : '');
    b.innerHTML = `<span class="no">${i + 1}</span><span class="nm">${d.name}</span><span class="st">${st ? '⭐'.repeat(st) : '🔸'}</span>`;
    b.onclick = () => loadLevel(i);
    grid.appendChild(b);
  });
  $('levels').classList.add('on');
  setFocusList();
  const firstNew = LEVELS.findIndex((_, i) => !save.stars[i]);
  focusIdx = firstNew < 0 ? 0 : firstNew; paintFocus();
  say('選一關開始冒險吧！');
}
function ok() {
  ensureAudio();
  if (overlayOn('levels') || overlayOn('win')) { focusList[focusIdx]?.click(); return; }
  hint();
}
function back() { if (overlayOn('levels')) { if (L) $('levels').classList.remove('on'); } else openLevels(); }

window.G = { dir, undo, restart, hint, rotate, openLevels, next, ok,
  get state() { return S; }, get level() { return L; }, get moves() { return moves; }, get won() { return won; }, solve: () => solve(L, S), move, loadLevel };

/* ---------- 鍵盤 / 遙控器 / 手把 / 滑動 ---------- */
addEventListener('keydown', e => {
  const m = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }, k = e.key.toLowerCase();
  if (m[e.key]) { e.preventDefault(); dir(m[e.key]); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ok(); }
  else if (k === 'z' || e.key === 'Backspace') { e.preventDefault(); undo(); }
  else if (k === 'r') restart();
  else if (k === 'h') hint();
  else if (k === 'q') rotate(-1);
  else if (k === 'e') rotate(1);
  else if (e.key === 'Escape') back();
});
const cv = renderer.domElement; let sw = null;
cv.addEventListener('pointerdown', e => { ensureAudio(); sw = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointerup', e => {
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.hypot(dx, dy) < 28) return;
  dir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});
const pads = {};
function pollPads() {
  let list = [];
  try { list = navigator.getGamepads ? navigator.getGamepads() : []; } catch (e) { return; }
  for (const gp of list) {
    if (!gp) continue;
    const st = pads[gp.index] || (pads[gp.index] = { prev: {}, dir: null, next: 0 });
    const now = {}; [0, 1, 2, 3, 4, 5, 9, 12, 13, 14, 15].forEach(i => now[i] = !!(gp.buttons[i] && gp.buttons[i].pressed));
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    let d = null;
    if (now[12] || ay < -0.6) d = 'up'; else if (now[13] || ay > 0.6) d = 'down'; else if (now[14] || ax < -0.6) d = 'left'; else if (now[15] || ax > 0.6) d = 'right';
    const t = performance.now();
    if (d && d !== st.dir) { dir(d); st.next = t + 380; } else if (d && t > st.next) { dir(d); st.next = t + 190; }
    st.dir = d;
    const edge = i => now[i] && !st.prev[i];
    if (edge(0)) ok(); if (edge(1)) back(); if (edge(2)) undo(); if (edge(3)) restart();
    if (edge(4)) rotate(-1); if (edge(5)) rotate(1); if (edge(9)) hint();
    st.prev = now;
  }
}
addEventListener('gamepadconnected', () => toast('🎮 手把已連線！十字鍵走路、□ 復原、△ 重來、✕ 提示、L1/R1 轉視角'));

/* ---------- 每一格畫面 ---------- */
let last = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  pollPads();
  if (!scene) return;
  azShown += (az - azShown) * 0.14;
  const a = azShown * Math.PI / 180, el = 0.92;
  camera.position.set(camR * Math.cos(el) * Math.sin(a), camR * Math.sin(el), camR * Math.cos(el) * Math.cos(a) + 0.6);
  camera.lookAt(0, 0, 0.6);
  // 小獅子：滑向目標格、跳一下、轉向
  const tp = cellPos(S.p);
  lion.position.x += (tp.x - lion.position.x) * 0.28; lion.position.z += (tp.z - lion.position.z) * 0.28;
  hop = Math.max(0, hop - dt * 4.5);
  const onBridge = S.bridges.includes(S.p);
  lion.position.y = (onBridge ? -0.02 : 0) + Math.sin(Math.PI * hop) * 0.3 + (won ? Math.abs(Math.sin(t / 160)) * 0.35 : 0);
  let dr = face - lion.rotation.y; while (dr > Math.PI) dr -= Math.PI * 2; while (dr < -Math.PI) dr += Math.PI * 2;
  lion.rotation.y += dr * 0.3;
  crateMeshes.forEach(c => { const p = cellPos(c.cell); const m = c.mesh;
    m.position.x += (p.x - m.position.x) * 0.3; m.position.z += (p.z - m.position.z) * 0.3;
    const near = Math.abs(p.x - m.position.x) + Math.abs(p.z - m.position.z) < 0.25;
    const ty = c.sunk && near ? -0.42 + Math.sin(t / 500 + c.cell) * 0.015 : 0.4;
    m.position.y += (ty - m.position.y) * 0.2; });
  const open = gateOpen(L, S);
  gateMeshes.forEach(g => { g.position.y += ((open ? -1.0 : 0) - g.position.y) * 0.15; });
  starMeshes.forEach((s, i) => { s.rotation.y = t / 500 + i; s.position.y = 0.55 + Math.sin(t / 350 + i) * 0.07; });
  if (chest) { const ready = S.stars === L.full; chest.userData.glow.visible = ready; chest.userData.glow.material.opacity = 0.5 + 0.5 * Math.sin(t / 180); chest.scale.setScalar(ready ? 1 + Math.sin(t / 200) * 0.05 : 1); }
  if (hintArrow.visible) hintArrow.position.y = 1.2 + Math.sin(t / 150) * 0.12;
  const pos = water.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setZ(i, Math.sin(pos.getX(i) * 1.3 + t / 700) * 0.035 + Math.cos(pos.getY(i) * 1.1 + t / 900) * 0.035);
  pos.needsUpdate = true;
  renderer.render(scene, camera);
}

const q = parseInt(new URLSearchParams(location.search).get('level') || '0', 10);
loadLevel(q >= 1 && q <= LEVELS.length ? q - 1 : Math.max(0, LEVELS.findIndex((_, i) => !save.stars[i])), true);
if (!(q >= 1)) openLevels();
requestAnimationFrame(frame);
</script>
</body>
